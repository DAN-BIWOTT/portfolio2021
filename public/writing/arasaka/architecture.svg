<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Arasaka Neural Bastion architecture</title>
  <desc id="desc">A pipeline diagram showing market data, feature engineering, model research, automation scripts, AWS EC2 deployment, MQL5, and monitoring.</desc>
  <rect width="1280" height="720" fill="#06110f"/>
  <rect x="56" y="54" width="1168" height="612" rx="18" fill="#0b1b18" stroke="#1f6f62" stroke-width="2"/>
