    <text x="617" y="310" fill="#9fd9cf" font-size="15">LinearSVR</text>
    <text x="617" y="334" fill="#9fd9cf" font-size="15">SFN ensemble</text>

    <rect x="836" y="236" width="188" height="112" rx="14" fill="#102b26" stroke="#37b39d"/>
