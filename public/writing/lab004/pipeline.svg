<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Lab 004 pipeline</title>
  <desc id="desc">A module pipeline for Lab 004 from MT5 broker connection through data, features, regimes, signals, strategy, backtests, risk, paper execution, and live monitoring.</desc>
  <rect width="1280" height="720" fill="#07110f"/>
  <rect x="56" y="54" width="1168" height="612" rx="20" fill="#0d1c19" stroke="#2c6f64" stroke-width="2"/>
  <text x="92" y="112" fill="#e5fffa" font-family="Arial, sans-serif" font-size="34" font-weight="700">Lab 004 - Proprietary Capital Systems</text>
  <text x="92" y="148" fill="#99cfc5" font-family="Arial, sans-serif" font-size="18">A modular forex research, risk, paper execution, and live trading pipeline.</text>

  <g font-family="Arial, sans-serif">
